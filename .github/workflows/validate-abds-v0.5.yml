name: Validate ABDS v0.5 artifacts

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "examples/**"
      - "scripts/validate_examples.py"
      - ".github/workflows/validate-abds-v0.5.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "scripts/validate_examples.py"
      - ".github/workflows/validate-abds-v0.5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.23,<5"

      - name: Validate schemas, examples, and invariants
        run: python scripts/validate_examples.py
